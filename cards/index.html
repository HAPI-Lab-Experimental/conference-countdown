<style>
:root{
  color-scheme: light;
  --ground:#EDEFF2; --surface:#FFFFFF; --ink:#151A21; --muted:#5A6473; --rule:#D5DAE1; --rule-strong:#B8C0CB;
  --soon:#B4690E; --soon-bg:#FFF4E3; --urgent:#C0331E; --urgent-bg:#FDECE8;
  --focus:#1D4ED8;
  /* colour-blind-safe categorical palette: one set of fills for both themes (white text on the fill >= 4.5:1, fill vs either surface >= 3:1), snapped with the dataviz palette validator; a text label always accompanies the colour */
  --area-rl:#C82D45; --area-robotics:#9343BC; --area-ml:#A84B07; --area-ai:#B1389B; --area-planning:#017716; --area-vision:#555BDA; --area-nlp:#068665;
  --shadow:0 1px 2px rgba(21,26,33,.06), 0 8px 24px -12px rgba(21,26,33,.18);
  --gap:14px;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0E1116; --surface:#171B22; --ink:#EDEFF2; --muted:#9AA3AF; --rule:#2A3039; --rule-strong:#3B434F;
    --soon:#E9A23B; --soon-bg:#2A2114; --urgent:#F0705A; --urgent-bg:#2E1914;
    --focus:#8AB4FF;
    --area-rl:#C82D45; --area-robotics:#9343BC; --area-ml:#A84B07; --area-ai:#B1389B; --area-planning:#017716; --area-vision:#555BDA; --area-nlp:#068665;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0E1116; --surface:#171B22; --ink:#EDEFF2; --muted:#9AA3AF; --rule:#2A3039; --rule-strong:#3B434F;
  --soon:#E9A23B; --soon-bg:#2A2114; --urgent:#F0705A; --urgent-bg:#2E1914;
  --focus:#8AB4FF;
  --area-rl:#C82D45; --area-robotics:#9343BC; --area-ml:#A84B07; --area-ai:#B1389B; --area-planning:#017716; --area-vision:#555BDA; --area-nlp:#068665;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:14px; line-height:1.4;
  display:flex; flex-direction:column;
  padding-block:12px; padding-inline:16px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}

/* Header */
.top{
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  padding-bottom:12px; border-bottom:1px solid var(--rule); flex:none;
}
.top h1{
  font-family:var(--display); font-weight:700; font-size:28px; line-height:1; margin:0;
  letter-spacing:.01em; text-transform:uppercase; text-wrap:balance;
}
.top .sub{color:var(--muted); font-size:12.5px; margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center}
.top .sub .dot::before{content:"·"; margin-right:10px; color:var(--rule-strong)}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:999px;
  border:1px solid var(--soon); color:var(--soon); background:var(--soon-bg); font-size:11.5px; font-weight:500;
}
.chip .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.top > .brand{flex:none}
.controls{display:flex; align-items:center; gap:8px 18px; flex:none; flex-wrap:wrap; justify-content:flex-end}

/* Rotating researcher quote in the header's middle column */
.quote{
  /* definite height = title block (28px h1 + 6px + 17.5px subtitle), so the quote can never change the header height */
  flex:1 1 0; min-width:0; height:51.5px; align-self:flex-end; margin:0; padding:0 8px;
  display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
  overflow:hidden; opacity:1; transition:opacity .2s ease;
}
.quote.fade{opacity:0}
.quote p{
  margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  line-height:1.15; color:var(--ink); text-wrap:balance; text-align:center; width:100%;
}
/* "being written" reveal: each word (or character, for script faces) fades in on its own CSS delay, one after another; no caret */
.quote .w{display:inline}
.quote.reveal .w{opacity:0; animation:qw .35s ease-out forwards}
@keyframes qw{from{opacity:0; transform:translateY(2px)} to{opacity:1; transform:none}}
.quote figcaption{
  margin-top:2px; font-family:var(--body); font-size:11px; line-height:1; color:var(--muted);
  font-variant:small-caps; letter-spacing:.08em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  text-align:center; opacity:1; transition:opacity .4s ease;
}
.quote.reveal figcaption{opacity:0; transition:none} /* hidden instantly at the swap, fades back in when the reveal completes */
.quote.face-playfair p{font-family:"Playfair Display",Georgia,"Times New Roman",serif; font-style:italic; font-weight:600}
.quote.face-lora p{font-family:Lora,Georgia,serif; font-weight:500}
.quote.face-lora-i p{font-family:Lora,Georgia,serif; font-style:italic; font-weight:500}
.quote.face-zilla p{font-family:"Zilla Slab","Roboto Slab",Georgia,serif; font-weight:600}
.quote.face-mono p{font-family:"IBM Plex Mono",Menlo,Consolas,monospace; font-weight:500}
.quote.face-script p{font-family:"Dancing Script","Brush Script MT",cursive; font-weight:600}
.quote.face-cormorant p{font-family:"Cormorant Garamond",Garamond,Georgia,serif; font-weight:600}
.quote.face-cormorant-i p{font-family:"Cormorant Garamond",Garamond,Georgia,serif; font-style:italic; font-weight:600}
.quote.face-condensed p{font-family:var(--display); font-weight:600; text-transform:uppercase; letter-spacing:.02em}
@media (max-width:1099px){ .quote{display:none} }
.show{display:flex; align-items:center; gap:8px}
.tags{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.tag{
  font:inherit; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; line-height:1.4;
  padding:3px 10px; border-radius:999px; cursor:pointer;
  color:var(--ink); background:var(--surface); border:1.5px solid var(--area);
  display:inline-flex; align-items:center; gap:6px;
  transition:background .15s, color .15s, border-color .15s;
}
.tag:hover{background:color-mix(in srgb, var(--area) 14%, transparent)}
.tag::before{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--area); flex:none}
.tag[aria-pressed="true"]{background:var(--area); color:#FFFFFF; border-color:var(--area); box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--area)}
.tag[aria-pressed="true"]::before{content:"\2713"; width:auto; height:auto; border-radius:0; background:none; font-weight:700; line-height:1}
.tag[data-area="RL"]{--area:var(--area-rl)} .tag[data-area="Robotics"]{--area:var(--area-robotics)}
.tag[data-area="ML"]{--area:var(--area-ml)} .tag[data-area="AI"]{--area:var(--area-ai)}
.tag[data-area="Vision"]{--area:var(--area-vision)} .tag[data-area="NLP"]{--area:var(--area-nlp)} .tag[data-area="Planning"]{--area:var(--area-planning)}
.tag-clear{
  font:inherit; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
  color:var(--muted); background:none; border:1.5px solid var(--rule-strong); border-radius:999px; padding:3px 10px;
}
.tag-clear:hover{color:var(--ink); border-color:var(--ink)}
.tags .hint{font-size:11.5px; color:var(--muted); margin-right:2px; white-space:nowrap}
.controls label{font-size:12.5px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.06em}
.controls select{
  font:inherit; font-size:14px; font-weight:600; color:var(--ink); background:var(--surface);
  border:1px solid var(--rule-strong); border-radius:6px; padding:5px 28px 5px 10px; cursor:pointer;
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:calc(100% - 14px) 55%, calc(100% - 9px) 55%; background-size:5px 5px; background-repeat:no-repeat;
}

/* Row of cards */
main{flex:1 1 auto; min-height:0; position:relative; padding-block:var(--gap) 10px}
.row{
  height:100%; position:relative;
  display:grid; gap:var(--gap);
  grid-template-columns:repeat(var(--cols,5), minmax(0,1fr));
  grid-auto-rows:minmax(0,1fr);
}
.card{
  --accent:var(--rule);
  container-type:size;
  position:relative; min-width:0; min-height:0;
  background:var(--surface); border:1px solid var(--accent); border-radius:10px;
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; padding:14px 16px 14px; gap:6px;
  overflow:hidden;
  transition:transform .55s cubic-bezier(.2,.7,.2,1), opacity .5s ease, border-color .3s ease;
}
.card[data-heat="soon"]{--accent:var(--soon); border-width:1.5px}
.card[data-heat="urgent"]{--accent:var(--urgent); border-width:2px; box-shadow:var(--shadow), 0 0 0 4px var(--urgent-bg)}
.card.entering{opacity:0; transform:translateX(48px)}
.card.leaving{opacity:0; transform:translateX(-48px); pointer-events:none}

.card .meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:22px}
.pill{
  display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px;
  font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; line-height:1.4;
  color:#FFFFFF; background:var(--area);
}
.pill[data-area="RL"]{--area:var(--area-rl)} .pill[data-area="Robotics"]{--area:var(--area-robotics)}
.pill[data-area="ML"]{--area:var(--area-ml)} .pill[data-area="AI"]{--area:var(--area-ai)}
.pill[data-area="Vision"]{--area:var(--area-vision)} .pill[data-area="NLP"]{--area:var(--area-nlp)} .pill[data-area="Planning"]{--area:var(--area-planning)}
.est{
  display:inline-flex; align-items:center; padding:1px 7px; border-radius:999px; border:1px dashed var(--rule-strong);
  color:var(--muted); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:500;
}
.card .home{
  margin-left:auto; color:var(--muted); display:inline-flex; width:26px; height:26px; align-items:center; justify-content:center;
  border-radius:6px; text-decoration:none;
}
.card .home:hover{color:var(--ink); background:color-mix(in srgb, var(--ink) 8%, transparent)}
.card .home svg{width:15px;height:15px;display:block}

.card .name{
  font-family:var(--display); font-weight:700; line-height:.95; margin:4px 0 0;
  font-size:clamp(22px, 13cqi, 40px); text-wrap:balance; letter-spacing:.005em;
}
.card .kind{color:var(--muted); font-size:clamp(12px, 4.5cqi, 14px); font-weight:500}
.card .kind b{color:var(--ink); font-weight:600}
.card .loc{color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.count{
  flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:flex-start;
  /* the numerals may shrink (see fit()) so the block never spills into its neighbours */
  gap:clamp(8px, 4cqi, 24px); padding-block:6px; flex-wrap:nowrap; overflow:hidden;
  font-variant-numeric:tabular-nums;
}
.unit{display:flex; flex-direction:column; align-items:flex-start; flex:0 0 auto}
/* --fit scales the numerals down: .wide when days reach three digits, .tight when a measurement still overflows */
.card{--fit:1}
.card.wide{--fit:.8}
.card.tight{--fit:.62}
.unit .v{
  font-family:var(--display); font-weight:600; line-height:.9; color:var(--ink);
  font-size:calc(clamp(30px, min(21cqi, 20cqb), 112px) * var(--fit) * var(--vfit, 1)); letter-spacing:-.01em;
}
.unit .l{font-size:clamp(10px, 3.2cqi, 12px); color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin-top:6px; font-weight:500}
.unit.sec .v{font-size:calc(clamp(15px, min(7cqi, 9cqb), 28px) * var(--fit) * var(--vfit, 1)); color:var(--muted); font-weight:500; align-self:flex-start}
.unit.sec .l{margin-top:4px}
.card[data-heat="soon"] .unit.days .v, .card[data-heat="soon"] .unit.hours .v{color:var(--soon)}
.card[data-heat="urgent"] .unit .v{color:var(--urgent)}

.when{border-top:1px solid var(--rule); padding-top:10px; display:flex; flex-direction:column; gap:2px}
.when .local{font-weight:600; font-size:clamp(12.5px, 4.6cqi, 15px); font-variant-numeric:tabular-nums}
.when .cfp{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}

.empty{grid-column:1/-1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; text-align:center; padding:24px}

footer{flex:none; color:var(--muted); font-size:12px; padding-top:6px; border-top:1px solid var(--rule); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
footer kbd{font:inherit; font-size:11px; border:1px solid var(--rule-strong); border-bottom-width:2px; border-radius:4px; padding:0 5px; color:var(--ink)}

.toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:var(--ground);
  padding:8px 14px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); z-index:10; pointer-events:none;
  opacity:0; transition:opacity .3s;
}
.toast.show{opacity:1}

/* Narrow: stack and scroll */
@media (max-width: 699px){
  html,body{height:auto}
  body{overflow:auto; min-height:100%}
  .top{flex-direction:column; align-items:flex-start}
  main{padding-block:var(--gap)}
  .row{height:auto; grid-template-columns:1fr !important; grid-auto-rows:auto}
  .card{height:230px}
  .unit .v{font-size:calc(clamp(36px, 15cqi, 72px) * var(--fit))}
}
@media (prefers-reduced-motion: reduce){
  .card{transition:none}
  .quote{transition:none}
  .quote.reveal .w{opacity:1; animation:none}
  .quote figcaption{transition:none}
  .quote.reveal figcaption{opacity:1}
  .card.entering{opacity:1; transform:none}
  .chip .pulse{animation:none}
}
</style>

<script>
(function(){
  'use strict';
  var DATA = JSON.parse(document.getElementById('deadlines').textContent);
  DATA.forEach(function(d){ d.ts = Date.parse(d.deadline); d.key = d.id; d.areas = Array.isArray(d.area) ? d.area : [d.area]; });
  DATA.sort(function(a,b){ return a.ts - b.ts; });

  var row = document.getElementById('row');
  var sel = document.getElementById('showN');
  var foot = document.getElementById('foot');
  var tzEl = document.getElementById('tz');
  var chip = document.getElementById('clock-chip');
  var chipText = document.getElementById('clock-chip-text');
  var toastEl = document.getElementById('toast');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ---- clock (supports ?now= offset and demo jump) ---- */
  var offset = 0;
  var params = new URLSearchParams(location.search);
  if (params.get('now')) {
    var p = Date.parse(params.get('now'));
    if (!isNaN(p)) { offset = p - Date.now(); chip.hidden = false; chipText.textContent = 'Preview clock (?now=)'; }
  }
  function now(){ return Date.now() + offset; }

  /* ---- N (URL hash > localStorage > 5) ---- */
  var ALLOWED = [3,4,5,6,8,10];
  function readN(){
    var m = /(?:^|[#&])n=(\d+)/.exec(location.hash);
    var n = m ? +m[1] : NaN;
    if (!ALLOWED.includes(n)) { try { n = +localStorage.getItem('cd.showN'); } catch(e){ n = NaN; } }
    return ALLOWED.includes(n) ? n : 5;
  }
  var N = readN();
  sel.value = String(N);

  /* ---- area tags (OR filter; none selected = all areas) ---- */
  var AREAS = ['RL','Robotics','ML','AI','Planning','Vision','NLP'].filter(function(a){ return DATA.some(function(d){ return d.areas.includes(a); }); });
  function matches(d){ return !tags.size || d.areas.some(function(a){ return tags.has(a); }); }
  function readTags(){
    var m = /(?:^|[#&])tags=([^&]*)/.exec(location.hash);
    var raw = m ? decodeURIComponent(m[1]) : null;
    if (raw === null) { try { raw = localStorage.getItem('cd.tags'); } catch(e){ raw = null; } }
    var set = new Set();
    (raw || '').split(',').forEach(function(a){ if (AREAS.includes(a)) set.add(a); });
    return set;
  }
  var tags = readTags();
  function tagsStr(){ return AREAS.filter(function(a){ return tags.has(a); }).join(','); }
  function writeState(){
    try { localStorage.setItem('cd.showN', String(N)); localStorage.setItem('cd.tags', tagsStr()); } catch(e){}
    try { history.replaceState(null, '', '#n=' + N + (tags.size ? '&tags=' + tagsStr() : '')); } catch(e){}
  }
  var tagsBox = document.getElementById('tags');
  var tagsHint = document.getElementById('tags-hint');
  var tagBtns = AREAS.map(function(a){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tag'; b.dataset.area = a; b.textContent = a;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function(){ if (tags.has(a)) tags.delete(a); else tags.add(a); writeState(); renderTags(); tick(true); });
    tagsBox.appendChild(b);
    return b;
  });
  var clearBtn = document.createElement('button');
  clearBtn.type = 'button'; clearBtn.className = 'tag-clear'; clearBtn.id = 'tags-clear'; clearBtn.textContent = 'All';
  clearBtn.setAttribute('aria-label', 'Clear area filter and show all areas');
  clearBtn.addEventListener('click', function(){ tags.clear(); writeState(); renderTags(); tick(true); });
  tagsBox.appendChild(clearBtn);
  function renderTags(){
    tagBtns.forEach(function(b){ b.setAttribute('aria-pressed', tags.has(b.dataset.area) ? 'true' : 'false'); });
    tagsHint.textContent = tags.size ? 'Any of:' : 'All areas';
    clearBtn.hidden = !tags.size;
  }
  renderTags();

  sel.addEventListener('change', function(){
    N = +sel.value;
    writeState(); tick(true);
  });
  window.addEventListener('hashchange', function(){
    var n = readN(), t2 = readTags(), changed = false;
    if (n !== N) { N = n; sel.value = String(N); changed = true; }
    if (tagsStr() !== AREAS.filter(function(a){ return t2.has(a); }).join(',')) { tags = t2; renderTags(); changed = true; }
    if (changed) tick(true);
  });

  var shown = N;
  function layoutCols(count){
    if (count !== undefined) shown = Math.max(1, Math.min(N, count));
    var w = row.clientWidth || window.innerWidth;
    var cols = (shown > 5 && w < shown * 200) ? Math.ceil(shown / 2) : shown;
    row.style.setProperty('--cols', cols);
  }
  window.addEventListener('resize', function(){ layoutCols(); });

  /* ---- formatting in the viewer's timezone ---- */
  var resolvedTZ = 'local';
  try { resolvedTZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local'; } catch(e){}
  var dtf = new Intl.DateTimeFormat(undefined, {
    weekday:'short', day:'numeric', month:'short', year:'numeric',
    hour:'2-digit', minute:'2-digit', hourCycle:'h23', timeZoneName:'short'
  });
  function part(parts, type){ var x = parts.find(function(q){ return q.type === type; }); return x ? x.value : ''; }
  function fmtLocal(ts){
    var parts = dtf.formatToParts(new Date(ts));
    return part(parts,'weekday') + ' ' + part(parts,'day') + ' ' + part(parts,'month') + ' ' + part(parts,'year') +
           ', ' + part(parts,'hour') + ':' + part(parts,'minute') + ' ' + part(parts,'timeZoneName');
  }
  function cfpTime(d){
    var m = /T(\d{2}):(\d{2})/.exec(d.deadline);
    return (m ? m[1] + ':' + m[2] : '') + ' ' + d.timezone;
  }
  function tzLabel(){
    var abbr = part(dtf.formatToParts(new Date(now())), 'timeZoneName');
    return resolvedTZ + (abbr && abbr !== resolvedTZ ? ' (' + abbr + ')' : '');
  }
  tzEl.textContent = 'Your timezone: ' + tzLabel();

  var pad = function(n){ return (n < 10 ? '0' : '') + n; };

  /* ---- card DOM ---- */
  var LINK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5H3.5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V9.5"/><path d="M9.5 2.5h4v4"/><path d="M13.5 2.5 7.5 8.5"/></svg>';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function makeCard(d){
    var el = document.createElement('article');
    el.className = 'card';
    el.dataset.key = d.key;
    el.dataset.heat = 'none';
    var kind = d.type === 'Deadline' ? 'Paper deadline' : d.type;
    el.innerHTML =
      '<div class="meta">' +
        d.areas.map(function(a){ return '<span class="pill" data-area="' + esc(a) + '">' + esc(a) + '</span>'; }).join('') +
        (d.status === 'estimated' ? '<span class="est" title="' + esc(d.source) + '">estimated</span>' : '') +
        '<a class="home" href="' + esc(d.url) + '" target="_blank" rel="noopener" aria-label="Open ' + esc(d.name) + ' homepage" title="' + esc(d.name) + ' homepage">' + LINK_SVG + '</a>' +
      '</div>' +
      '<h2 class="name">' + esc(d.name) + '</h2>' +
      '<div class="kind"><b>' + esc(kind) + '</b>' + (d.location && d.location !== 'TBA' ? ' · ' + esc(d.location) : '') + '</div>' +
      '<div class="count">' +
        '<div class="unit days"><span class="v" data-u="d">--</span><span class="l">days</span></div>' +
        '<div class="unit hours"><span class="v" data-u="h">--</span><span class="l">hours</span></div>' +
        '<div class="unit mins"><span class="v" data-u="m">--</span><span class="l">min</span></div>' +
        '<div class="unit sec"><span class="v" data-u="s">--</span><span class="l">sec</span></div>' +
      '</div>' +
      '<div class="when">' +
        '<span class="local">' + esc(fmtLocal(d.ts)) + '</span>' +
        '<span class="cfp">' + esc(cfpTime(d)) + ' · ' + esc(d.timezone === 'AoE' ? 'Anywhere on Earth (UTC−12)' : 'CFP timezone') + '</span>' +
      '</div>';
    el._u = { d: el.querySelector('[data-u="d"]'), h: el.querySelector('[data-u="h"]'), m: el.querySelector('[data-u="m"]'), s: el.querySelector('[data-u="s"]') };
    el._data = d;
    return el;
  }
  function updateCard(el, t){
    var diff = Math.max(0, el._data.ts - t);
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor(diff % 86400000 / 3600000);
    var mins = Math.floor(diff % 3600000 / 60000);
    var secs = Math.floor(diff % 60000 / 1000);
    var u = el._u;
    if (u.d.textContent !== String(days)) {
      var digitsChanged = u.d.textContent.length !== String(days).length;
      u.d.textContent = days;
      el.classList.toggle('wide', days >= 100);
      if (digitsChanged) fit(el);
    }
    var hh = pad(hours), mm = pad(mins), ss = pad(secs);
    if (u.h.textContent !== hh) u.h.textContent = hh;
    if (u.m.textContent !== mm) u.m.textContent = mm;
    if (u.s.textContent !== ss) u.s.textContent = ss;
    var heat = diff < 86400000 ? 'urgent' : diff < 7 * 86400000 ? 'soon' : 'none';
    if (el.dataset.heat !== heat) el.dataset.heat = heat;
  }

  /* ---- make sure the three groups fit the card width ---- */
  function fit(el){
    var c = el._count || (el._count = el.querySelector('.count'));
    el.classList.remove('tight');
    if (c.scrollWidth > c.clientWidth + 1) el.classList.add('tight');
    // vertical: on short cards step the numerals down until the card's content fits its box
    el.style.removeProperty('--vfit');
    var v = 1;
    var over = function(){ return el.scrollHeight > el.clientHeight || c.scrollHeight > c.clientHeight; };
    while (over() && v > 0.45) { v -= 0.1; el.style.setProperty('--vfit', v.toFixed(2)); }
  }
  function refit(){
    Array.prototype.forEach.call(row.children, function(c){ if (c.classList.contains('card') && !c.classList.contains('leaving')) fit(c); });
  }
  window.addEventListener('resize', refit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);

  /* ---- reconcile visible set every tick (leave / FLIP / enter) ---- */
  var LEAVE_MS = 560;
  function tick(force){
    var t = now();
    var upcoming = DATA.filter(function(d){ return d.ts > t && matches(d); });
    var want = upcoming.slice(0, N);
    layoutCols(want.length);
    var wantKeys = want.map(function(d){ return d.key; });
    var current = Array.prototype.filter.call(row.children, function(c){ return c.classList.contains('card') && !c.classList.contains('leaving'); });
    var curKeys = current.map(function(c){ return c.dataset.key; });
    var changed = force || wantKeys.length !== curKeys.length || wantKeys.some(function(k,i){ return k !== curKeys[i]; });

    if (changed) {
      var anim = !reduce.matches;
      var staying = current.filter(function(c){ return wantKeys.includes(c.dataset.key); });
      var leaving = current.filter(function(c){ return !wantKeys.includes(c.dataset.key); });
      var first = new Map();
      if (anim) staying.forEach(function(c){ first.set(c, c.getBoundingClientRect()); });

      leaving.forEach(function(c){
        if (!anim) { c.remove(); return; }
        var r = c.getBoundingClientRect(), pr = row.getBoundingClientRect();
        c.classList.add('leaving');
        c.style.position = 'absolute';
        c.style.left = (r.left - pr.left) + 'px'; c.style.top = (r.top - pr.top) + 'px';
        c.style.width = r.width + 'px'; c.style.height = r.height + 'px';
        setTimeout(function(){ c.remove(); }, LEAVE_MS);
      });
      // remove any stale non-card children (empty state)
      Array.prototype.forEach.call(row.querySelectorAll('.empty'), function(e){ e.remove(); });

      var byKey = new Map(staying.map(function(c){ return [c.dataset.key, c]; }));
      var entering = [];
      want.forEach(function(d){
        var el = byKey.get(d.key);
        if (!el) { el = makeCard(d); if (anim) el.classList.add('entering'); entering.push(el); }
        row.appendChild(el); // appending in order also reorders staying cards
      });
      if (!want.length) {
        var e = document.createElement('div'); e.className = 'empty';
        e.textContent = tags.size ? 'No upcoming deadlines for ' + tagsStr().replace(/,/g, ', ') + '.' : 'No upcoming deadlines in the current list.';
        row.appendChild(e);
      }
      entering.forEach(function(el){ updateCard(el, t); });

      if (anim) {
        // FLIP: slide staying cards from their old position to the new one
        staying.forEach(function(c){
          var f = first.get(c), l = c.getBoundingClientRect();
          var dx = f.left - l.left, dy = f.top - l.top;
          if (dx || dy) { c.style.transition = 'none'; c.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; }
        });
        // force style flush, then release
        void row.offsetWidth;
        requestAnimationFrame(function(){
          staying.forEach(function(c){ c.style.transition = ''; c.style.transform = ''; });
          entering.forEach(function(el){ el.classList.remove('entering'); });
        });
      }
      refit();
      foot.textContent = want.length + ' of ' + upcoming.length + ' upcoming deadlines' + (tags.size ? ' in ' + tagsStr().replace(/,/g, ', ') : '') + ' · times shown in your local timezone (' + resolvedTZ + ') · dates marked estimated are inferred from the previous edition';
    }

    Array.prototype.forEach.call(row.children, function(c){ if (c.classList.contains('card') && !c.classList.contains('leaving')) updateCard(c, t); });
  }

  /* ---- demo: jump the clock to 15 s before the next deadline ---- */
  var toastTimer;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 3200);
  }
  document.addEventListener('keydown', function(ev){
    if (ev.key !== 'd' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName)) return;
    var t = now();
    var next = DATA.find(function(d){ return d.ts > t && matches(d); });
    if (!next) return;
    offset = (next.ts - 15000) - Date.now();
    chip.hidden = false; chipText.textContent = 'Demo clock · 15 s before ' + next.name;
    tzEl.textContent = 'Your timezone: ' + tzLabel();
    toast('Demo: clock set to 15 s before ' + next.name + ' · ' + next.type + '. Reload to reset.');
    tick(true);
  });

  tick(true);
  setInterval(tick, 1000);

  /* ---- rotating researcher quotes (header middle column) ---- */
  var QUOTES = [
    { t: 'We can only see a short distance ahead, but we can see plenty there that needs to be done.', w: 'Alan Turing, 1950', f: 'playfair' },
    { t: '\u2026general methods that leverage computation are ultimately the most effective, and by a large margin.', w: 'Richard Sutton, The Bitter Lesson, 2019', f: 'mono' },
