<meta name="description" content="Live countdowns to AI conference deadlines and conference dates.">

<body data-mode="all">
<header class="site-head">
  <a class="site-title" href="./">Conference Countdown</a>
  <p class="now" aria-label="Current time">
    <span id="now-local">--:--:--</span>
    <span class="now-sep" aria-hidden="true"></span>
    <span id="now-aoe">--:-- AoE</span>
  </p>
</header>

<main id="app">
  <noscript><p class="empty">This page needs JavaScript to run the countdowns.</p></noscript>
</main>

<footer class="site-foot">
  <p>AoE means Anywhere on Earth (UTC&minus;12): a deadline holds until that moment has passed everywhere. Times are also shown in your local time zone.</p>
  <p>To add a conference, edit <code>conferences.json</code> or run <code>scripts/add_conference.py</code>.</p>
</footer>
